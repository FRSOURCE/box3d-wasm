<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Box3D wasm + three.js</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .panel {
        color: #cdd6f4;
        font: 13px/1.5 monospace;
        background: rgba(11, 14, 20, 0.7);
        border: 1px solid #2a2f3a;
        border-radius: 6px;
        padding: 8px 12px;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        pointer-events: none;
        white-space: pre;
      }
      #profile {
        position: fixed;
        top: 120px;
        left: 10px;
        z-index: 10;
        pointer-events: none;
        white-space: pre;
      }
      #menu {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
        max-width: 60vw;
      }
      #controls {
        position: fixed;
        bottom: 10px;
        left: 10px;
        z-index: 10;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #controls label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #controls label[hidden] {
        display: none;
      }
      #controls input[type='range'] {
        accent-color: #89b4fa;
        width: 120px;
      }
      button {
        color: #cdd6f4;
        font: 13px monospace;
        cursor: pointer;
        background: rgba(11, 14, 20, 0.7);
        border: 1px solid #2a2f3a;
        border-radius: 6px;
        padding: 6px 12px;
      }
      button:hover {
        border-color: #89b4fa;
      }
      button.active {
        background: #89b4fa;
        color: #0b0e14;
        border-color: #89b4fa;
      }
      #ghlink {
        position: fixed;
        bottom: 10px;
        right: 10px;
        z-index: 10;
        color: #cdd6f4;
        font: 13px monospace;
        text-decoration: none;
        background: rgba(11, 14, 20, 0.7);
        border: 1px solid #2a2f3a;
        border-radius: 6px;
        padding: 6px 12px;
      }
      #ghlink:hover {
        border-color: #89b4fa;
        color: #89b4fa;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hud" class="panel">loading...</div>
    <div id="profile" class="panel" hidden></div>
    <div id="menu"></div>
    <div id="controls" class="panel">
      <button id="threads" type="button">threads: ...</button>
      <label id="workers-label" hidden>
        <span id="workers-value">workers: 1</span>
        <input id="workers" type="range" min="1" max="1" step="1" value="1" />
      </label>
    </div>
    <a
      id="ghlink"
      href="https://github.com/FRSOURCE/box3d-wasm"
      target="_blank"
      rel="noopener"
      >@frsource/box3d-wasm on GitHub</a
    >
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
