<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Box3D wasm + three.js</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #0b0e14;
        --panel: rgba(11, 14, 20, 0.82);
        --border: #2a2f3a;
        --text: #cdd6f4;
        --dim: #7f849c;
        --accent: #89b4fa;
        --gold: #f9e2af;
        --green: #a6e3a1;
        --red: #f38ba8;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 monospace;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      [hidden] {
        display: none !important;
      }
      button,
      input,
      select {
        font: inherit;
        color: var(--text);
      }
      button {
        cursor: pointer;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
      }
      button:hover {
        border-color: var(--accent);
      }
      kbd {
        color: var(--dim);
        font: inherit;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 6px 0;
      }

      /* menu bar */
      #menubar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 28px;
        z-index: 20;
        display: flex;
        align-items: center;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      #menubar .menu {
        position: relative;
      }
      #menubar .menu-button {
        border: 0;
        border-radius: 0;
        background: none;
        height: 28px;
      }
      #menubar .menu-button.active,
      #menubar .menu-button:hover {
        background: var(--border);
      }
      .dropdown {
        position: absolute;
        top: 28px;
        left: 0;
        min-width: 220px;
        background: #11141c;
        border: 1px solid var(--border);
        border-radius: 0 0 6px 6px;
        padding: 4px 0;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .dropdown.sub {
        top: -5px;
        left: 100%;
        display: none;
        border-radius: 6px;
      }
      .dropdown .item {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        width: 100%;
        box-sizing: border-box;
        border: 0;
        border-radius: 0;
        background: none;
        text-align: left;
        padding: 3px 12px;
        position: relative;
        white-space: nowrap;
      }
      .dropdown .item:hover,
      .dropdown .item.has-sub:hover {
        background: var(--border);
      }
      .dropdown .item.active {
        color: var(--gold);
      }
      .dropdown .item.has-sub:hover > .sub {
        display: block;
      }
      .dropdown .field input {
        width: 70px;
        background: var(--bg);
        border: 1px solid var(--border);
      }
      #about {
        margin-left: auto;
        padding: 0 12px;
        color: var(--dim);
      }

      /* right info panel */
      #info {
        position: fixed;
        top: 38px;
        right: 10px;
        bottom: 10px;
        width: 260px;
        z-index: 10;
        box-sizing: border-box;
        overflow-y: auto;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      #info .name {
        color: var(--gold);
      }
      #info .category {
        color: var(--dim);
      }
      #info .paused {
        color: var(--red);
      }
      #info .stats {
        color: var(--green);
        white-space: pre;
      }
      #info .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 2px 0;
      }
      #info .row .lbl {
        flex: 0 0 90px;
      }
      #info .row.check .lbl {
        flex: 1;
      }
      #info .row input[type='range'] {
        flex: 1;
        min-width: 0;
        accent-color: var(--accent);
      }
      #info .row .val {
        flex: 0 0 52px;
        text-align: right;
        color: var(--dim);
      }
      #info .row select {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
      }
      #info .line {
        color: var(--dim);
        white-space: pre-wrap;
      }
      #info summary {
        cursor: pointer;
        color: var(--accent);
        margin: 4px 0;
      }

      /* bottom diagnostics drawer */
      #drawer {
        position: fixed;
        left: 10px;
        right: 282px;
        bottom: 10px;
        height: 230px;
        z-index: 10;
        box-sizing: border-box;
        overflow: auto;
        padding: 6px 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      #drawer .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
      }
      #drawer .tab.active {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
      }
      #drawer .tab.right {
        margin-left: auto;
      }
      #drawer table {
        border-collapse: collapse;
      }
      #drawer th {
        text-align: left;
        color: var(--dim);
        font-weight: normal;
      }
      #drawer td,
      #drawer th {
        padding: 0 10px 0 0;
      }
      #drawer .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #drawer canvas {
        width: auto;
        height: auto;
        display: block;
      }

      /* text lines and minimal HUD */
      #texts {
        position: fixed;
        top: 38px;
        left: 10px;
        z-index: 5;
        white-space: pre;
        pointer-events: none;
        text-shadow: 0 0 3px #000;
      }
      #hud-title,
      #hud-stats {
        position: fixed;
        left: 10px;
        z-index: 5;
        display: none;
        white-space: pre;
        pointer-events: none;
        text-shadow: 0 0 3px #000;
      }
      #hud-title {
        top: 10px;
        color: var(--gold);
      }
      #hud-stats {
        bottom: 10px;
        color: var(--green);
      }
      body.ui-hidden #hud-title,
      body.ui-hidden #hud-stats {
        display: block;
      }
      body.ui-hidden #menubar,
      body.ui-hidden #info,
      body.ui-hidden #drawer {
        display: none;
      }
      body.ui-hidden #texts {
        top: 70px;
      }

      /* modal overlays: sample picker and controls */
      #picker,
      #help {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 12vh;
        background: rgba(0, 0, 0, 0.35);
      }
      #picker .dialog,
      #help .dialog {
        width: min(480px, 90vw);
        max-height: 70vh;
        overflow-y: auto;
        background: #11141c;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      }
      #picker input {
        width: 100%;
        box-sizing: border-box;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 8px;
      }
      #picker .item {
        display: flex;
        justify-content: space-between;
        width: 100%;
        border: 0;
        background: none;
        text-align: left;
        border-radius: 4px;
      }
      #picker .item.active,
      #picker .item:hover {
        background: var(--border);
      }
      #picker .empty {
        color: var(--dim);
        padding: 4px 8px;
      }
      #help header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #help h2,
      #help h3 {
        margin: 6px 0;
        font-size: 13px;
        color: var(--accent);
      }
      #help td {
        padding: 1px 14px 1px 0;
      }

      #error {
        position: fixed;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        color: var(--red);
        background: var(--panel);
        border: 1px solid var(--red);
        border-radius: 6px;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="menubar"><span id="about">loading...</span></div>
    <div id="info"></div>
    <div id="drawer"></div>
    <div id="texts"></div>
    <div id="hud-title"></div>
    <div id="hud-stats"></div>
    <div id="picker"></div>
    <div id="help"></div>
    <div id="error" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
